# /etc/nginx/conf.d/limit-contact.conf  (contexte http, chargé automatiquement)
# 5 envois par minute et par IP ; le jeton est plus permissif (rechargements de page).
limit_req_zone $binary_remote_addr zone=contact:10m       rate=5r/m;
limit_req_zone $binary_remote_addr zone=contact_token:10m rate=30r/m;
